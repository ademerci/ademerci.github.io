<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · ademerci</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background-color: #3a3a3a;
    background-image: linear-gradient(45deg, #333 25%, transparent 25%, transparent 75%, #333 75%), linear-gradient(45deg, #333 25%, #3f3f3f 25%, #3f3f3f 50%, #2e2e2e 50%, #2e2e2e 75%, #333 75%);
    background-size: 48px 48px;
    background-position: 0 0, 24px 24px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: white;
    font-family: 'VT323', monospace;
    overflow: hidden;
    padding: 16px;
    text-align: center;
}
.ore { position: absolute; width: 48px; height: 48px; background: #4a4a4a; z-index: 0; }
.o1 { top: 10%; left: 10%; box-shadow: 8px 8px #d97757, 32px 16px #d97757, 16px 32px #d97757; }
.o2 { top: 70%; right: 15%; box-shadow: 8px 16px #7cd0ff, 24px 8px #7cd0ff, 32px 32px #7cd0ff; }
.container { z-index: 1; max-width: 600px; }
h1 { font-family: 'Press Start 2P', cursive; font-size: clamp(3rem, 15vw, 8rem); text-shadow: 6px 6px 0 #1a1a1a; margin-bottom: 20px; }
.sub { font-family: 'Press Start 2P', cursive; font-size: 0.8rem; margin-bottom: 10px; }
.text { font-size: 1.5rem; margin-bottom: 30px; }
a {
    display: inline-block;
    background: #d97757;
    color: white;
    font-family: 'Press Start 2P', cursive;
    font-size: 12px;
    padding: 16px;
    text-decoration: none;
    border: 4px solid #1a1a1a;
    box-shadow: 4px 4px 0 #1a1a1a;
}
a:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #1a1a1a; }
a:focus { outline: 3px solid white; }
.snail-track { position: absolute; bottom: 48px; width: 100%; height: 64px; }
#snail {
    width: 96px; height: 64px;
    animation: crawl 60s linear infinite steps(120);
    transform: scaleX(-1);
}
@keyframes crawl { from { margin-left: -100px; } to { margin-left: 100%; } }
@media (prefers-reduced-motion: reduce) { #snail { animation: none; margin-left: 10%; } }
.floor { position: absolute; bottom: 0; left: 0; width: 100%; height: 48px; background: #5a5a5a linear-gradient(90deg, #2a2a2a 4px, transparent 4px) 0 0 / 48px 48px; border-top: 4px solid #2a2a2a; }
.block { width: 48px; height: 48px; background: #5a5a5a; border: 4px solid #2a2a2a; }
</style>
</head>
<body>
<div class="ore o1"></div><div class="ore o2"></div>
<div class="container">
    <h1>404</h1>
    <div class="sub">Die Schnecke hat diese Seite gefressen.</div>
    <div class="text">Sie ist langsam, aber sie frisst alles. Geh lieber zurück an die Oberfläche.</div>
    <a href="/">Zurück nach oben</a>
</div>
<div class="snail-track">
    <svg id="snail" viewBox="0 0 12 8" shape-rendering="crispEdges">
        <rect x="0" y="0" width="1" height="1" fill="#2b2b2b"/><rect x="4" y="0" width="1" height="1" fill="#2b2b2b"/>
        <rect x="1" y="1" width="1" height="1" fill="#2b2b2b"/><rect x="3" y="1" width="1" height="1" fill="#2b2b2b"/><rect x="6" y="1" width="4" height="1" fill="#5a3820"/>
        <rect x="1" y="2" width="1" height="1" fill="#9bb07a"/><rect x="2" y="2" width="1" height="1" fill="#9bb07a"/><rect x="3" y="2" width="1" height="1" fill="#9bb07a"/><rect x="5" y="2" width="1" height="1" fill="#5a3820"/><rect x="6" y="2" width="4" height="1" fill="#c08a5a"/><rect x="10" y="2" width="1" height="1" fill="#5a3820"/>
        <rect x="1" y="3" width="1" height="1" fill="#9bb07a"/><rect x="2" y="3" width="1" height="1" fill="#9bb07a"/><rect x="3" y="3" width="1" height="1" fill="#9bb07a"/><rect x="4" y="3" width="1" height="1" fill="#5a3820"/><rect x="5" y="3" width="1" height="1" fill="#c08a5a"/><rect x="6" y="3" width="3" height="1" fill="#5a3820"/><rect x="9" y="3" width="2" height="1" fill="#c08a5a"/>
        <rect x="1" y="4" width="1" height="1" fill="#9bb07a"/><rect x="2" y="4" width="1" height="1" fill="#9bb07a"/><rect x="3" y="4" width="1" height="1" fill="#9bb07a"/><rect x="4" y="4" width="1" height="1" fill="#5a3820"/><rect x="5" y="4" width="1" height="1" fill="#c08a5a"/><rect x="6" y="4" width="1" height="1" fill="#5a3820"/><rect x="7" y="4" width="1" height="1" fill="#c08a5a"/><rect x="8" y="4" width="1" height="1" fill="#5a3820"/><rect x="9" y="2" width="2" height="1" fill="#c08a5a"/>
        <rect x="1" y="5" width="1" height="1" fill="#9bb07a"/><rect x="2" y="5" width="1" height="1" fill="#9bb07a"/><rect x="3" y="5" width="1" height="1" fill="#9bb07a"/><rect x="4" y="5" width="1" height="1" fill="#5a3820"/><rect x="5" y="5" width="1" height="1" fill="#c08a5a"/><rect x="6" y="5" width="2" height="1" fill="#5a3820"/><rect x="8" y="5" width="2" height="1" fill="#c08a5a"/>
        <rect x="0" y="6" width="5" height="1" fill="#9bb07a"/><rect x="5" y="6" width="1" height="1" fill="#5a3820"/><rect x="6" y="7" width="4" height="1" fill="#c08a5a"/>
        <rect x="0" y="7" width="12" height="1" fill="#9bb07a"/>
    </svg>
</div>
<div class="floor"></div>
</body>
</html>
